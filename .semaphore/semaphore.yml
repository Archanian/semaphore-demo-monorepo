version: v1.0
name: Monorepo Demo
agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu2004
blocks:
  - name: Core
    dependencies: []
    task:
      jobs:
        - name: Build
          commands: []
        - name: Test
          commands: []
  - name: Package
    dependencies:
      - Core
    run:
      when: tag =~ '.*'
    task:
      jobs:
        - name: Publish
          commands: []
        - name: Push
          commands: []
  - name: Job Router
    dependencies:
      - Core
    task:
      jobs:
        - name: Test
          commands: []
  - name: Job Processor
    dependencies:
      - Core
    task:
      jobs:
        - name: Test
          commands: []
  - name: API
    dependencies:
      - Core
    task:
      jobs:
        - name: Test
          commands: []
  - name: SMTP
    dependencies:
      - Core
    task:
      jobs:
        - name: Test
          commands: []
  - name: Integration Tests
    dependencies:
      - API
      - Job Processor
      - Job Router
      - SMTP
    task:
      jobs:
        - name: API
          commands: []
        - name: SMTP
          commands: []
promotions:
  - name: Publish Packages
    pipeline_file: pipeline_2.yml
    auto_promote:
      when: branch = 'master' AND result = 'passed'
  - name: Publish Images
    pipeline_file: pipeline_3.yml
    auto_promote:
      when: branch = 'master' AND result = 'passed'
