version: v1.0
name: Monorepo Demo
agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu2004
blocks:
  - name: Core
    dependencies: []
    task:
      jobs:
        - name: Build
          commands: []
        - name: Test
          commands: []
  - name: Package
    dependencies:
      - Core
    run:
      when: tag =~ '.*'
    task:
      jobs:
        - name: Publish
          commands: []
        - name: Push
          commands: []
  - name: Job Router
    dependencies:
      - Core
    task:
      jobs:
        - name: Test
          commands: []
  - name: Job Processor
    dependencies:
      - Core
    task:
      jobs:
        - name: Test
          commands: []
  - name: API
    dependencies:
      - Core
    task:
      jobs:
        - name: Test
          commands: []
  - name: SMTP
    dependencies:
      - Core
    task:
      jobs:
        - name: Test
          commands: []
  - name: Integration Tests
    dependencies:
      - API
      - Job Processor
      - Job Router
      - SMTP
    task:
      jobs:
        - name: API
          commands: []
        - name: SMTP
          commands: []
promotions:
  - name: Deploy
    pipeline_file: pipeline_3.yml
    parameters:
      env_vars:
        - required: true
          options:
            - Production
            - Staging
          default_value: ''
          description: Deployment target
          name: ENVIRONMENT
