version: v1.0
name: 'Prepare ${{parameters.ENVIRONMENT}}'
agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu2004
blocks:
  - name: API
    task:
      jobs:
        - name: Docker build
          commands:
            - echo "job 1"
        - name: ECR push
          commands: []
    run:
      when: change_in('/src/Helo.Sending.Api') or change_in('/src/Helo.Sending')
    dependencies: []
  - name: SMTP
    task:
      jobs:
        - name: Docker build
          commands: []
        - name: ECR push
          commands: []
    run:
      when: change_in('/src/Helo.Sending.Smtp') or change_in('/src/Helo.Sending')
    dependencies: []
  - name: 'Plan ${{parameters.ENVIRONMENT}}'
    dependencies:
      - API
      - Job Router
      - SMTP
    task:
      jobs:
        - name: Terraform Plan
          commands: []
      env_vars:
        - name: ENVIRONMENT
          value: '${{parameters.ENVIRONMENT}}'
  - name: Job Router
    dependencies: []
    task:
      jobs:
        - name: Docker build
          commands: []
        - name: ECR push
          commands: []
promotions:
  - name: 'Confirm Deploy ${{parameters.ENVIRONMENT}}'
    pipeline_file: pipeline_4.yml
    parameters:
      env_vars:
        - required: true
          options:
            - '${{parameters.ENVIRONMENT}}'
          default_value: ''
          description: Target deployment environment
          name: ENVIRONMENT
